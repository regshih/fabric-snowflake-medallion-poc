name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check generators snowflake_source validation infra tools tests
      - run: python -m pip_audit --local --progress-spinner off
      - run: python tools/security_scan.py --working-tree --git-history
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.2"
      - run: terraform fmt -check -recursive infra/azure
      - run: terraform -chdir=infra/azure/snowflake-private-endpoint init -backend=false
      - run: terraform -chdir=infra/azure/snowflake-private-endpoint validate
