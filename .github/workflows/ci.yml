name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m ruff check generators snowflake_source validation infra tools tests
      - run: python -m pip_audit --local --progress-spinner off
      - run: python tools/security_scan.py --working-tree --git-history
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.2"
      - run: terraform fmt -check -recursive infra/azure
      - run: terraform -chdir=infra/azure/snowflake-private-endpoint init -backend=false
      - run: terraform -chdir=infra/azure/snowflake-private-endpoint validate
